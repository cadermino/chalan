services:
  flask:
    build:
      context: .
      dockerfile: flask/Dockerfile.local
    volumes:
      - .:/chalan
    ports:
      - 8001:8001
    env_file: .env.dev
    restart: always
    links:
      - db:dbserver
  backoffice-api:
    build:
      context: .
      dockerfile: backoffice-api/Dockerfile.local
    volumes:
      - ./backoffice-api:/backoffice-api
    ports:
      - 8002:8002
    environment:
      - INTERNAL_API_URL=http://flask:8001
    env_file: .env.backoffice.dev
    restart: always
    links:
      - db:dbserver
  backoffice:
    build:
      context: .
      dockerfile: backoffice/Dockerfile.local
    volumes:
      - ./backoffice/src:/app/src
    ports:
      - 5173:5173
    environment:
      - VITE_API_URL=http://localhost:8002
    restart: always
  services-web:
    build:
      context: .
      dockerfile: services-web/Dockerfile.local
    volumes:
      - ./services-web/src:/app/src
    ports:
      - 5174:5174
    # Trae VITE_PLACES_API_KEY (la misma key de Places que NEXT_PUBLIC_PLACES_API_KEY);
    # sin ella el formulario cae al aviso con botón de WhatsApp.
    env_file: .env.dev
    environment:
      - VITE_API_URL=/api/v1
      - DEV_API_PROXY_TARGET=http://flask:8001
    restart: always
  vuex:
    build:
      context: .
      dockerfile: vuex/Dockerfile.local
    volumes:
      - ./frontend:/chalan
      - /chalan/node_modules
    ports:
      - 8080:8080
    env_file: frontend/.env.development
    restart: always
  nextjs:
    build:
      context: .
      dockerfile: nextjs/Dockerfile.local
    volumes:
      - ./frontend-react/src:/app/src
      - ./frontend-react/public:/app/public
      - ./frontend-react/content:/app/content
    ports:
      - 3000:3000
    env_file: .env.dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost
      - INTERNAL_API_URL=http://flask:8001
    restart: always
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.local
    ports:
      - 80:8000
    restart: always
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    env_file: .env.postgres.dev
    restart: always
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: