# Dentro de la red de Docker, sin TLS: el nginx principal termina el HTTPS y
# reenvía acá /embalaje/cotizar, /armado/cotizar, /pintura/cotizar, /porcelanato/cotizar
# y /services-web/.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Archivos del build (assets, favicon, logo). =404 para que un archivo
    # faltante no devuelva el index.html con 200 (mismo problema que ya pasó con
    # el backoffice: el navegador recibía HTML donde esperaba JavaScript).
    location /services-web/ {
        try_files $uri =404;

        # Los assets llevan hash en el nombre: caché eterna.
        location /services-web/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
    }

    # Cada formulario devuelve su HTML, con su título y su vista previa al
    # compartir (el build los genera desde src/share.js). Nunca se cachean: son
    # los que nombran los bundles del deploy actual. El de cotizaciones del
    # cliente cuelga del mismo prefijo, así que hereda la del servicio.
    location ^~ /embalaje/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /services-web/embalaje.html =404;
    }
    location ^~ /armado/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /services-web/armado.html =404;
    }
    location ^~ /pintura/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /services-web/pintura.html =404;
    }
    location ^~ /porcelanato/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /services-web/porcelanato.html =404;
    }

    # Cualquier otra ruta devuelve el index, que nunca se cachea.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /services-web/index.html =404;
    }
}
