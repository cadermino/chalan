# Dentro de la red de Docker, sin TLS: el nginx principal termina el HTTPS y
# reenvía acá /embalaje/cotizar y /services-web/.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Archivos del build (assets, favicon, logo). =404 para que un archivo
    # faltante no devuelva el index.html con 200 (mismo problema que ya pasó con
    # el backoffice: el navegador recibía HTML donde esperaba JavaScript).
    location /services-web/ {
        try_files $uri =404;

        # Los assets llevan hash en el nombre: caché eterna.
        location /services-web/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
    }

    # Cualquier ruta del formulario devuelve el index, que nunca se cachea: es el
    # que nombra los bundles del deploy actual.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /services-web/index.html =404;
    }
}
