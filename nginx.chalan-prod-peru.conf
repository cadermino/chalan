# Define the parameters for a specific virtual host/server
server {
    listen 80;
    server_name chalan.pe www.chalan.pe;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
   # Define the directory where the contents being requested are stored
   # root /chalan/frontend/dist;

   # Define the default page that will be served If no page was requested
   # (ie. if www.kennedyfamilyrecipes.com is requested)
   # index index.html;

   # Define the server name, IP address, and/or port of the server
   listen 443 ssl;
   # server_name xxx.yyy.zzz.aaa
   server_name chalan.pe www.chalan.pe;
   server_tokens off;

   ssl_certificate /etc/letsencrypt/live/chalan.pe/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/chalan.pe/privkey.pem;
   include /etc/letsencrypt/options-ssl-nginx.conf;
   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

   # Re-resolve upstream hostnames via Docker's embedded DNS instead of
   # caching the IP at startup/reload, so a rebuilt/restarted dependency
   # with a new IP is picked up within 10s instead of needing a reload.
   resolver 127.0.0.11 valid=10s;
   set $flask_backend http://flask-api:8001;
   set $nextjs_backend http://nextjs:3000;
   set $backoffice_backend http://backoffice-api:8002;

   # Define the specified charset to the “Content-Type” response header field
   charset utf-8;
   # Vue app routes
   location @vue {
       root /chalan/frontend/dist;
       # El index nunca se cachea: es el que nombra los bundles con hash. Si el
       # navegador se queda con uno viejo pide archivos que el deploy ya borró,
       # y la app no arranca hasta que el usuario recargue forzado — algo que a
       # un cliente no se le puede pedir.
       add_header Cache-Control "no-store, must-revalidate" always;
       rewrite ^.*$ /index.html break;
   }

   location = /index.html {
       root /chalan/frontend/dist;
       add_header Cache-Control "no-store, must-revalidate" always;
   }

   location /order {
       root /chalan/frontend/dist;
       index index.html;
       try_files $uri $uri/ @vue;
   }

   location /carrier-company {
       root /chalan/frontend/dist;
       index index.html;
       try_files $uri $uri/ @vue;
   }

   location /dashboard {
       root /chalan/frontend/dist;
       index index.html;
       try_files $uri $uri/ @vue;
   }

   location /register-login {
       root /chalan/frontend/dist;
       index index.html;
       try_files $uri $uri/ @vue;
   }

   location /login {
       root /chalan/frontend/dist;
       index index.html;
       try_files $uri $uri/ @vue;
   }

   location /register {
       root /chalan/frontend/dist;
       index index.html;
       try_files $uri $uri/ @vue;
   }

   location /quotation {
       root /chalan/frontend/dist;
       index index.html;
       try_files $uri $uri/ @vue;
   }

   # Vue static assets (js, css, img built by webpack). Llevan hash en el
   # nombre, así que un archivo dado nunca cambia de contenido: se puede
   # cachear para siempre, y el index (que no se cachea) es el que decide
   # cuáles pedir.
   location /js {
       root /chalan/frontend/dist;
       add_header Cache-Control "public, max-age=31536000, immutable" always;
   }

   location /css {
       root /chalan/frontend/dist;
       add_header Cache-Control "public, max-age=31536000, immutable" always;
   }

   location /img {
       root /chalan/frontend/dist;
       add_header Cache-Control "public, max-age=31536000, immutable" always;
   }

   location /favicon.ico {
       root /chalan/frontend/dist;
   }

   # Next.js static assets
   location /_next {
       proxy_pass $nextjs_backend;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
   }

   # Backoffice API (proxy to backoffice-api container)
   location /backoffice-api/ {
       rewrite ^/backoffice-api/(.*) /$1 break;
       proxy_pass $backoffice_backend;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       client_max_body_size 5M;
   }

   # Backoffice React SPA (static build)
   location /backoffice/ {
       alias /chalan/backoffice/dist/;
       index index.html;
       try_files $uri $uri/ /backoffice/index.html;
   }

   # Mismo motivo que en el index del Vue, y acá ya pasó: tras un deploy el
   # navegador seguía pidiendo el bundle anterior y no se podía entrar al
   # backoffice.
   location = /backoffice/index.html {
       alias /chalan/backoffice/dist/index.html;
       add_header Cache-Control "no-store, must-revalidate" always;
   }

   # Los assets llevan hash, así que caché eterna. El =404 es lo importante: el
   # try_files de arriba devolvía el index.html cuando faltaba un archivo, y el
   # navegador recibía HTML con 200 donde esperaba JavaScript. La app moría sin
   # un solo error que explicara por qué.
   location /backoffice/assets/ {
       alias /chalan/backoffice/dist/assets/;
       add_header Cache-Control "public, max-age=31536000, immutable" always;
       try_files $uri =404;
   }

   # Next.js API routes (must be before the Flask /api block)
   location /api/waitlist {
       proxy_pass $nextjs_backend;
       proxy_http_version 1.1;
       proxy_set_header Host $host;
   }

   # Flask API
   location /api {
       proxy_pass $flask_backend;
       proxy_http_version 1.1;
       proxy_set_header Connection "";
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       client_max_body_size 5M;
   }

   # Everything else goes to Next.js
   location / {
       proxy_pass $nextjs_backend;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection 'upgrade';
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_cache_bypass $http_upgrade;
   }
}
