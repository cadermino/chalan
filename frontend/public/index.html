<!DOCTYPE html>

    <% if (process.env.NODE_ENV === 'production') { %>
    <!-- Begin Inspectlet Asynchronous Code -->
    <script type="text/javascript">
      (function() {
      window.__insp = window.__insp || [];
      __insp.push(['wid', 1681414770]);
      var ldinsp = function(){
      if(typeof window.__inspld != "undefined") return; window.__inspld = 1; var insp = document.createElement('script'); insp.type = 'text/javascript'; insp.async = true; insp.id = "inspsync"; insp.src = ('https:' == document.location.protocol ? 'https' : 'http') + '://cdn.inspectlet.com/inspectlet.js?wid=1681414770&r=' + Math.floor(new Date().getTime()/3600000); var x = document.getElementsByTagName('script')[0]; x.parentNode.insertBefore(insp, x); };
      setTimeout(ldinsp, 0);

    </script>
    <!-- End Inspectlet Asynchronous Code -->

    <!-- Google tag (gtag.js). send_page_view is off here because this is an
         SPA - router/index.js's afterEach hook sends page_view on every
         route change instead, including the first one, so nothing is
         double-counted or missed on client-side navigation.

         El measurement ID no es secreto (viaja en el HTML igual). El default
         mantiene produccion funcionando sin tocar el deploy; VUE_APP_GA_ID
         solo hace falta para apuntar a otra propiedad, o para encender GA en
         local y validar los eventos en DebugView antes de desplegar. -->
    <% if (process.env.NODE_ENV === 'production' || process.env.VUE_APP_GA_ID) { %>
    <script async src="https://www.googletagmanager.com/gtag/js?id=<%= process.env.VUE_APP_GA_ID || 'G-72KVLDWMQD' %>"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '<%= process.env.VUE_APP_GA_ID || 'G-72KVLDWMQD' %>', {
        send_page_view: false,
        <% if (process.env.NODE_ENV !== 'production') { %>debug_mode: true,<% } %>
      });
    </script>
    <% } %>
