<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" role="img" aria-label="Por cada S/ 100 de la cotización más barata, la más cara costó S/ 167 (mediana de 25 solicitudes de mudanza en Chalán, 2026)." font-family="Inter, 'Inter Tight', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="720" height="296" rx="16" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="295" rx="16" fill="none" stroke="#e2e8f0"/>
<text x="32" y="54" font-size="22" fill="#0f172a" font-weight="650" text-anchor="start">La cotización más cara costó 67% más que la más barata</text>
<text x="32" y="84" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Por cada S/ 100 que costó la más barata. Mediana de 25 solicitudes de mudanza con 2 o más cotizaciones.</text>
<text x="188" y="147" font-size="15" fill="#0f172a" font-weight="500" text-anchor="end">La más barata</text>
<path d="M200 130 H435.521 A4 4 0 0 1 439.521 134 V150 A4 4 0 0 1 435.521 154 H200 Z" fill="#818cf8"/>
<text x="449.521" y="147" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">S/ 100</text>
<text x="188" y="191" font-size="15" fill="#0f172a" font-weight="500" text-anchor="end">La más cara</text>
<rect x="200" y="174" width="238.521" height="24" fill="#818cf8"/>
<path d="M440.521 174 H596 A4 4 0 0 1 600 178 V194 A4 4 0 0 1 596 198 H440.521 Z" fill="#4f46e5"/>
<text x="519.76" y="166" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">+ S/ 67</text>
<text x="610" y="191" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">S/ 167</text>
<line x1="200" y1="118" x2="200" y2="210" stroke="#e2e8f0"/>
<rect x="200" y="214" width="12" height="12" rx="3" fill="#818cf8"/>
<text x="218" y="224" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Precio de la más barata</text>
<rect x="400" y="214" width="12" height="12" rx="3" fill="#4f46e5"/>
<text x="418" y="224" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Lo que costó de más la más cara</text>
<line x1="32" y1="250" x2="688" y2="250" stroke="#e2e8f0"/>
<text x="32" y="274" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Fuente: cotizaciones recibidas en Chalán. Abril–octubre 2026.</text>
<text x="688" y="274" font-size="14" fill="#4f46e5" font-weight="700" text-anchor="end">chalan.pe</text>
</svg>
