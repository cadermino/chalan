<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 562" width="400" height="562" role="img" aria-label="Motivos por los que un transportista no cotizó en Chalán: fecha ocupada 38%, zona 25%, vehículo 22%, otro 9%, presupuesto 6%." font-family="Inter, 'Inter Tight', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="400" height="562" rx="16" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="399" height="561" rx="16" fill="none" stroke="#e2e8f0"/>
<text x="20" y="40" font-size="20" fill="#0f172a" font-weight="650" text-anchor="start">Por qué un transportista</text>
<text x="20" y="66" font-size="20" fill="#0f172a" font-weight="650" text-anchor="start">no cotiza tu mudanza</text>
<text x="20" y="94" font-size="14" fill="#475569" font-weight="400" text-anchor="start">32 veces en que un transportista avisó</text>
<text x="20" y="114" font-size="14" fill="#475569" font-weight="400" text-anchor="start">que no podía tomar una mudanza en Chalán.</text>
<text x="20" y="160" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">Ya tiene esa fecha ocupada</text>
<path d="M20 168 H304.8 A4 4 0 0 1 308.8 172 V188 A4 4 0 0 1 304.8 192 H20 Z" fill="#4f46e5"/>
<text x="318.8" y="185" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">38%</text>
<text x="20" y="222" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">No trabaja en esa zona</text>
<path d="M20 230 H206 A4 4 0 0 1 210 234 V250 A4 4 0 0 1 206 254 H20 Z" fill="#4f46e5"/>
<text x="220" y="247" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">25%</text>
<text x="20" y="284" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">No tiene el vehículo adecuado</text>
<path d="M20 292 H183.2 A4 4 0 0 1 187.2 296 V312 A4 4 0 0 1 183.2 316 H20 Z" fill="#4f46e5"/>
<text x="197.2" y="309" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">22%</text>
<text x="20" y="346" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">Otro motivo</text>
<path d="M20 354 H84.4 A4 4 0 0 1 88.4 358 V374 A4 4 0 0 1 84.4 378 H20 Z" fill="#4f46e5"/>
<text x="98.4" y="371" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">9%</text>
<text x="20" y="408" font-size="15" fill="#0f172a" font-weight="500" text-anchor="start">El presupuesto no le alcanza</text>
<path d="M20 416 H61.6 A4 4 0 0 1 65.6 420 V436 A4 4 0 0 1 61.6 440 H20 Z" fill="#4f46e5"/>
<text x="75.6" y="433" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">6%</text>
<line x1="20" y1="474" x2="380" y2="474" stroke="#e2e8f0"/>
<text x="20" y="498" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Fuente: avisos de transportistas en Chalán.</text>
<text x="20" y="516" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">2026.</text>
<text x="380" y="540" font-size="14" fill="#4f46e5" font-weight="700" text-anchor="end">chalan.pe</text>
</svg>
