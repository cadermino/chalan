<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Mudanza dentro de Lima en Chalán: precio mediano S/ 330; la mitad de las cotizaciones entre S/ 220 y S/ 390 (2026)." font-family="Inter, 'Inter Tight', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="720" height="340" rx="16" fill="#ffffff"/>
