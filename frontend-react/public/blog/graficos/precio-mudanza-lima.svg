<text x="32" y="318" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Fuente: cotizaciones recibidas en Chalán. Abril–octubre 2026. Precio final, con todo incluido.</text>
<text x="688" y="318" font-size="14" fill="#4f46e5" font-weight="700" text-anchor="end">chalan.pe</text>
