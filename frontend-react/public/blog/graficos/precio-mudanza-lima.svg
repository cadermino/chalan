<line x1="360" y1="158" x2="360" y2="214" stroke="#e2e8f0"/>
<text x="360" y="234" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">S/ 300</text>
<line x1="460" y1="158" x2="460" y2="214" stroke="#e2e8f0"/>
