<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Transportista subió sus documentos</title>
  </head>
  <body style="background-color: #f6f6f6; font-family: sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.4; margin: 0; padding: 0;">
    <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: separate; width: 100%; background-color: #f6f6f6;">
      <tr>
        <td style="font-family: sans-serif; font-size: 14px; vertical-align: top;">&nbsp;</td>
        <td style="font-family: sans-serif; font-size: 14px; vertical-align: top; display: block; Margin: 0 auto; max-width: 580px; padding: 10px; width: 580px;">
          <div style="box-sizing: border-box; display: block; Margin: 0 auto; max-width: 580px; padding: 10px;">
            <table style="border-collapse: separate; width: 100%; background: #ffffff; border-radius: 3px;">
              <tr>
                <td style="text-align: center; font-family: sans-serif; font-size: 14px; vertical-align: top; box-sizing: border-box; padding: 20px;">
                  <b>Transportista subió sus documentos</b>
                </td>
              </tr>
              <tr>
                <td style="font-family: sans-serif; font-size: 14px; vertical-align: top; box-sizing: border-box; padding: 20px;">
                  <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: separate; width: 100%;">
                    <tr>
                      <td style="font-family: sans-serif; font-size: 14px; vertical-align: top;">
                        <p style="margin: 0; Margin-bottom: 15px;"><b>Empresa:</b> {{ company.name }}</p>
                        <p style="margin: 0; Margin-bottom: 15px;"><b>Id de empresa:</b> {{ company.id }}</p>
                        <p style="margin: 0; Margin-bottom: 15px;">Subió su DNI o carné de extranjería, su licencia de conducir y la tarjeta de propiedad.</p>
                        <p style="margin: 0;">Revísalos en <a href="{{ backoffice_url }}">la empresa, en el backoffice</a>, y llena los datos de la tarjeta en Vehículos → Editar.</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            <div style="clear: both; Margin-top: 10px; text-align: center; width: 100%;">
              <span style="color: #999999; font-size: 12px;">Chalán</span>
            </div>
          </div>
        </td>
        <td style="font-family: sans-serif; font-size: 14px; vertical-align: top;">&nbsp;</td>
      </tr>
    </table>
  </body>
</html>
